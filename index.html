<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>بطاقة مكافآت جنوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A1420;
    --panel: #101E30;
    --panel-2: #16283D;
    --steel: #1E3A5F;
    --steel-light: #3D6A9E;
    --red: #C23B3B;
    --gold: #D6A431;
    --text: #EAF0F6;
    --muted: #7E96AF;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(ellipse 120% 60% at 50% -10%, #16283D 0%, var(--ink) 55%);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 60px; }
  .brand-row { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 6px; opacity: 0.9; }
  .brand-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .brand-row span { font-size: 13px; letter-spacing: 0.4px; color: var(--muted); }
  .card-stage { perspective: 1200px; margin: 18px 0 26px; }
  .card {
    position: relative; height: 210px; border-radius: 20px; cursor: pointer;
    transform-style: preserve-3d; transition: transform 0.65s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px;
    padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card-front {
    background: linear-gradient(135deg, #1B3252 0%, #0F2038 60%, #0A1626 100%);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card-front::after {
    content: ""; position: absolute; inset: 0; border-radius: 20px; opacity: 0.5;
    background: radial-gradient(circle at 85% 10%, rgba(214,164,49,0.18), transparent 45%);
    pointer-events: none;
  }
  .card-back { background: linear-gradient(135deg, #0F2038, #0A1626); transform: rotateY(180deg);
    align-items: center; justify-content: center; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-tier { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; padding: 4px 10px; border-radius: 20px; }
  .tier-gold { background: rgba(214,164,49,0.16); color: var(--gold); border: 1px solid rgba(214,164,49,0.3); }
  .tier-silver { background: rgba(158,178,199,0.14); color: #C7D4E0; border: 1px solid rgba(199,212,224,0.25); }
  .card-name { font-size: 20px; font-weight: 700; margin: 0 0 2px; }
  .card-id { font-size: 12px; color: var(--muted); letter-spacing: 0.5px; direction: ltr; text-align: right; }
  .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .card-points-num { font-size: 30px; font-weight: 800; line-height: 1; }
  .card-points-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .flip-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
  .barcode-lines { display: flex; gap: 2px; height: 46px; align-items: stretch; }
  .barcode-lines div { width: 3px; background: #E5EAF0; border-radius: 1px; }
  .card-back-num { font-size: 15px; letter-spacing: 3px; color: var(--muted); margin-top: 10px; direction: ltr; }
  .progress-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-top .label { font-size: 13px; color: var(--muted); }
  .progress-top .value { font-size: 13px; color: var(--gold); font-weight: 600; }
  .progress-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--steel-light), var(--gold)); transition: width 0.8s ease; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .stat-box .num { font-size: 18px; font-weight: 700; }
  .stat-box .label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 10px; padding-inline-start: 2px; }
  .invoice-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; }
  .invoice-left .date { font-size: 12px; color: var(--muted); }
  .invoice-left .id { font-size: 13px; font-weight: 600; margin-top: 2px; direction: ltr; text-align: right; }
  .invoice-right { font-size: 15px; font-weight: 700; color: var(--gold); }
  .invoice-status { font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-top: 3px; display: inline-block; }
  .status-fulfilled { background: rgba(53,160,90,0.15); color: #5FCB84; }
  .status-pending { background: rgba(214,164,49,0.15); color: var(--gold); }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; }
  .loader { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: var(--muted); font-size: 14px; }
  .error-box { text-align: center; padding: 60px 20px; }
  .error-box .title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .error-box .sub { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loader">جارِ تحميل بطاقتك…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const FIREBASE_PROJECT_ID = "jsm-suite";
  firebase.initializeApp({
    apiKey: "AIzaSyBPIC8j5z8bARY3i6FJ2-PHI4NsR213VWk",
    authDomain: "jsm-suite.firebaseapp.com",
    projectId: FIREBASE_PROJECT_ID,
  });
  const db = firebase.firestore();

  async function fetchCustomer(customerId) {
    const snap = await db.collection("customers").doc(customerId).get();
    if (!snap.exists) return null;
    return snap.data();
  }

  const parts = window.location.pathname.split("/").filter(Boolean);
  const customerId = parts[parts.length - 1];
  const appEl = document.getElementById("app");

  function money(n) {
    return "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function tierFor(points) {
    if (points >= 5000) return { name: "بلاتيني", cls: "tier-silver", next: null };
    if (points >= 1500) return { name: "ذهبي", cls: "tier-gold", next: 5000 };
    return { name: "فضي", cls: "tier-silver", next: 1500 };
  }
  function dateLabel(iso) {
    if (!iso) return "";
    try { return new Date(iso).toLocaleDateString("ar", { day: "2-digit", month: "long", year: "numeric" }); } catch { return iso; }
  }
  function renderError(title, sub) {
    appEl.innerHTML = `
      <div class="brand-row"><span class="dot"></span><span>سوبرماركت جنوب</span></div>
      <div class="error-box">
        <div class="title">${title}</div>
        <div class="sub">${sub}</div>
      </div>`;
  }
  function renderCustomer(data) {
    const name = data.name || "عميل جنوب";
    const points = Number(data.points) || 0;
    const totalSpent = Number(data.totalSpent) || 0;
    const invoices = data.recentInvoices || [];
    const tier = tierFor(points);
    const barStart = tier.name === "فضي" ? 0 : (tier.name === "ذهبي" ? 1500 : 5000);
    const barEnd = tier.next || (points + 1);
    const pct = tier.next ? Math.min(100, Math.round(((points - barStart) / (barEnd - barStart)) * 100)) : 100;
    const barcodeBars = Array.from({ length: 38 }, () => Math.random() > 0.5 ? 2 : 1);
    appEl.innerHTML = `
      <div class="brand-row"><span class="dot"></span><span>سوبرماركت جنوب</span></div>
      <div class="card-stage">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="card-top">
              <div>
                <div class="card-name">${name}</div>
                <div class="card-id">${data.customerId || customerId}</div>
              </div>
              <div class="card-tier ${tier.cls}">${tier.name}</div>
            </div>
            <div class="card-bottom">
              <div>
                <div class="card-points-num">${points.toLocaleString("en-US")}</div>
                <div class="card-points-label">نقطة</div>
              </div>
            </div>
          </div>
          <div class="card-face card-back">
            <div>
              <div class="barcode-lines">${barcodeBars.map(w => `<div style="width:${w}px"></div>`).join("")}</div>
              <div class="card-back-num">${data.customerId || customerId}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="flip-hint">اضغط على البطاقة لعرض باركود المسح</div>
      ${tier.next ? `
      <div class="progress-card">
        <div class="progress-top">
          <span class="label">للوصول إلى المستوى التالي</span>
          <span class="value">${(tier.next - points).toLocaleString("en-US")} نقطة</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>` : ""}
      <div class="stats-row">
        <div class="stat-box"><div class="num">${money(totalSpent)}</div><div class="label">إجمالي المشتريات</div></div>
        <div class="stat-box"><div class="num">${invoices.length}</div><div class="label">آخر الفواتير</div></div>
        <div class="stat-box"><div class="num">${points.toLocaleString("en-US")}</div><div class="label">النقاط الحالية</div></div>
      </div>
      <div class="section-title">آخر الفواتير</div>
      <div>
        ${invoices.length === 0
          ? `<div class="empty-note">ما في فواتير مسجَّلة بعد.</div>`
          : invoices.slice(0, 10).map(inv => `
            <div class="invoice-row">
              <div class="invoice-left">
                <div class="date">${dateLabel(inv.date)}</div>
                <div class="id">#${(inv.id || "").slice(0, 8)}</div>
              </div>
              <div style="text-align:left">
                <div class="invoice-right">${money(inv.total)}</div>
                <span class="invoice-status ${inv.status === 'fulfilled' ? 'status-fulfilled' : 'status-pending'}">
                  ${inv.status === 'fulfilled' ? 'مكتملة' : 'قيد التجهيز'}
                </span>
              </div>
            </div>
          `).join("")}
      </div>
    `;
    const card = document.getElementById("card");
    card.addEventListener("click", () => card.classList.toggle("flipped"));
  }
  async function load() {
    if (!customerId) {
      renderError("رابط غير صالح", "ما في رقم عضوية بالرابط.");
      return;
    }
    try {
      const data = await fetchCustomer(customerId);
      if (!data) {
        renderError("ما لقينا هالبطاقة", "تأكد من مسح الرمز الصحيح، أو تواصل مع خدمة العملاء.");
        return;
      }
      renderCustomer(data);
    } catch (err) {
      console.error(err);
      renderError("تعذّر تحميل البطاقة", "يُرجى المحاولة مرة أخرى بعد قليل.");
    }
  }
  load();
</script>
</body>
</html>
